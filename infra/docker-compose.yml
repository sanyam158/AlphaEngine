# Local services. API, worker and web containers are added in later phases.
#   docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alphaengine
      POSTGRES_PASSWORD: alphaengine
      POSTGRES_DB: alphaengine
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphaengine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

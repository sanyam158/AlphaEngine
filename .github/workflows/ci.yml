name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Unit & property tests
        run: pytest -m "not integration" --cov-report=xml

  integration:
    runs-on: ubuntu-latest
    needs: python
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alphaengine
          POSTGRES_PASSWORD: alphaengine
          POSTGRES_DB: alphaengine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alphaengine"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ALPHAENGINE_TEST_POSTGRES_URL: postgresql+psycopg://alphaengine:alphaengine@localhost:5432/alphaengine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration tests
        run: pytest -m integration --no-cov

# Swing (trend breakout): buy liquid stocks closing at a 52-week high while above their 200-day
# average; ride the trend with a 3-ATR trailing stop. Rules mode: up to 10 equal positions,
# each held until an exit fires (entries checked daily, exits at the next open).
name: swing_breakout
version: 1
description: 52-week-high breakouts in uptrends; 3-ATR trailing stop, 8% stop-loss, 120-day time stop; 10 slots.
schedule: daily
universe: {type: liquidity, top_n: 200, window: 126}
filters:
  - {type: min_price, value: 50}
  - {type: min_history, days: 273}
  - {type: feature, feature: max_abs_return, params: {window: 252}, op: "<", value: 0.35}
  - {type: feature, feature: price_to_sma, params: {window: 200}, op: ">", value: 0}
  - {type: feature, feature: high_proximity, params: {window: 252}, op: ">=", value: 0.995}
scorer: {type: feature, feature: risk_adj_momentum, params: {lookback: 126, skip: 0, vol_window: 63}}
selector: {type: top_n, n: 10}
weighter: {type: equal}
max_positions: 10
exits:
  - {type: trailing_stop, atr_mult: 3.0}
  - {type: stop_loss, pct: 0.08}
  - {type: time_stop, days: 120}
